<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b14">
    <title>GPKING Messenger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">GPKING<span>.</span></div>
        <div class="status">
            <span class="status-dot"></span>
            Новый уровень общения
        </div>
    </header>

    <main class="hero">
        <div class="badge">✦ МЕССЕНДЖЕР НОВОГО ПОКОЛЕНИЯ</div>

        <h1>
            Твоя связь.<br>
            <span>Твои правила.</span>
        </h1>

        <p class="description">
            Общайся с близкими, делись моментами
            и оставайся на связи с GPKING.
        </p>

        <button class="start-button" onclick="startGPKING()">
            Начать общение <span>→</span>
        </button>

        <div class="preview">
            <div class="preview-icon">G</div>
            <div>
                <strong>GPKING Messenger</strong>
                <p>Твоя история начинается здесь.</p>
            </div>
            <div class="online-dot"></div>
        </div>
    </main>

    <footer>
        <span>GPKING © 2026</span>
        <span>Создано для общения ♥</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
