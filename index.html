<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>GPKING Messenger</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="logo">👑 GPKING</div>
        <div class="online">
            <span></span> Новый уровень общения
        </div>
    </header>

    <main class="hero">
        <div class="cover">
            <img src="assets/cover.png" alt="Обложка GPKING">
        </div>

        <div class="badge">✦ ТВОЙ МЕССЕНДЖЕР</div>

        <h1>
            Будь ближе.<br>
            <span>Общайся свободно.</span>
        </h1>

        <p class="description">
            Твои близкие, твои разговоры и твои моменты.
            Всё начинается с GPKING.
        </p>

        <button id="startButton">
            Войти или зарегистрироваться <span>→</span>
        </button>

        <div class="info-card">
            <div class="avatar">G</div>
            <div class="info-text">
                <strong>GPKING Messenger</strong>
                <p>Твоя связь. Твои правила.</p>
            </div>
            <div class="green-dot"></div>
        </div>
    </main>

    <footer>
        <span>GPKING © 2026</span>
        <span>Создано для общения ♥</span>
    </footer>

    <!-- Библиотека Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Код приложения -->
    <script src="script.js"></script>
</body>
</html>
